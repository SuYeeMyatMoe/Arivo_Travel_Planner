name: arivo
description: "Arivo — the Living AI Travel OS. Your trip isn't generated once; it travels with you."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  connectivity_plus: ^7.3.1
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_3d_controller: ^2.3.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  maplibre_gl: ^0.27.1
  rive: ^0.14.11
  shared_preferences: ^2.5.5
  speech_to_text: ^7.5.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
    - assets/mascot/sprites/
    - assets/mascot/posters/
